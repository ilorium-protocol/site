#
# Deploy ilorium.com to Cloudflare Pages.
#
# Runs only on push to main. main is protected (organization ruleset: pull
# request required, status checks, signed commits; interim: only the founder
# merges). The job uses the GitHub environment `production`, which the founder
# configures with himself as required reviewer. A deployment is gated twice:
# the merge to main and the environment approval.
#
# Secrets, set by the founder on the `production` environment, never in the repo:
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID  the account id
# No agent holds these secrets. Bots have no access to the environment.
# Variables: DEPLOY_ENABLED (the switch: deploy runs only when it is 'true'), PUBLIC_REPO_LIVE (true once the repository is public), PROTOCOL_REF
# (the protocol tag once it exists).
#
# GitHub Pages was rejected: it cannot set response headers (HSTS preload,
# CSP, Permissions-Policy). Cloudflare Pages reads dist/_headers.
# Third-party actions are pinned to full commit SHAs (version in the comment).

name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # Off until the founder turns it on: set the repository variable DEPLOY_ENABLED=true
    # once the Cloudflare Pages project and the environment secrets exist.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ilorium.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the protocol documents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ilorium-protocol/protocol
          ref: ${{ vars.PROTOCOL_REF || 'main' }}
          path: _protocol
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --require-hashes -r tools/requirements.txt
      - name: Render the documents (tools/build.py)
        run: python3 tools/build.py --protocol _protocol --public public --ref "${PROTOCOL_REF:-main}"
        env:
          PROTOCOL_REF: ${{ vars.PROTOCOL_REF }}
      - run: |
          python3 tools/check_lighthouse.py --public public
          python3 tools/check_agent_readable.py public

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_REPO_LIVE: ${{ vars.PUBLIC_REPO_LIVE || 'false' }}
      - run: python3 tools/check_site.py dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ilorium-com --branch main --commit-dirty=true

      - name: Check the deployed headers (advisory; propagation may lag)
        continue-on-error: true
        run: python3 tools/check_headers.py https://ilorium.com
